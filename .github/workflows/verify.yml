name: Verify

on:
  pull_request:
  push:
    branches: [main, supabase]
  # `workflow_dispatch` also covers manual reruns of either job below.
  workflow_dispatch:

jobs:
  frontend:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    # Always runs on pull_request/push — not gated, not known to fail.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Scoped deliberately to ONLY the Supabase-generated types file. `npm
      # run build` also rewrites several unrelated src/generated/*.json files
      # (via the skill-compiler/self-healing pre-build scripts) — those are
      # owned by a separate tool and are NOT covered by this check. See
      # docs/supabase-migration/06-testing-and-ci-inventory.md for the full
      # reasoning behind this scoping decision.
      #
      # Corrected 2026-08-01 (Foundation Correction pass): renamed from "Check
      # generated Supabase types are committed and current" — that name
      # overstated what this step proves. This only shows that the normal
      # frontend build (which does not regenerate database.types.ts) did not
      # itself modify the committed file. It does NOT prove the committed
      # types still match the live/local database schema — that comparison
      # requires a real schema to generate against, which only the `database`
      # job (below) has access to.
      - name: Verify frontend build did not modify committed Supabase types
        run: git diff --exit-code -- src/lib/database.types.ts

  database:
    name: Local schema rebuild and RLS tests
    runs-on: ubuntu-latest
    # Re-enabled on pull_request/push 2026-08-01 (Base Phase 4, environment/CI
    # readiness pass). This job was previously workflow_dispatch-only because
    # only 2 of 5 applied migrations existed as local files at the time (see
    # git history on this file for the original comment). The migration
    # baseline is now complete and independently verified zero-diff against
    # the remote project's schema (supabase/migrations/README.md,
    # docs/supabase-migration/19-foundation-reconciliation.md), so the
    # original reason to gate this job no longer applies.
    #
    # This job does not require SUPABASE_ACCESS_TOKEN: `supabase start` +
    # `db reset` + `test db` run entirely against a disposable local Postgres
    # container and never touch the remote project.
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned 2026-08-01 (Foundation Correction pass) to the version
          # directly verified in this environment via `npx --yes supabase
          # --version` (see docs/supabase-migration/06-testing-and-ci-inventory.md).
          # `latest` was replaced because an unpinned CLI version can change
          # behavior between runs without any change to this repository.
          version: 2.111.0
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      # Added 2026-08-01 (Foundation Correction pass): this is the actual
      # schema-vs-committed-types comparison the frontend job's renamed step
      # (above) explicitly does NOT perform. Types are generated from the
      # just-rebuilt LOCAL database (never the remote project) into a
      # temporary file — the committed src/lib/database.types.ts is never
      # overwritten by CI, only compared against.
      - name: Generate types from the local database
        run: supabase gen types typescript --local > /tmp/database.types.ts
      - name: Compare committed types against local-schema-generated types
        run: diff -u src/lib/database.types.ts /tmp/database.types.ts
